<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 556" width="1200" height="556" role="img" aria-labelledby="t d">
<title id="t">Unified Knowledge Agent</title><desc id="d">Pipeline: question, input firewall, fast path, scope router, agent, answer. A human approves heavy tools. Search recall 34 of 34, AI logic 90 of 94, full RAG logic 38 of 41, on 94 test cases.</desc>
<style>
  .flow{stroke-dasharray:5 11;animation:flow 2.2s linear infinite}
  .edge{animation:edge 30s linear infinite}
  .pulse{animation:pulse 4s ease-in-out infinite}
  @keyframes flow{to{stroke-dashoffset:-32}}
  @keyframes edge{to{stroke-dashoffset:-1200}}
  @keyframes pulse{50%{opacity:.45}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060b14"/><stop offset="1" stop-color="#0c1626"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22d3ee"/><stop offset=".7" stop-color="#22d3ee"/><stop offset="1" stop-color="#facc15"/></linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#38bdf8" stroke-opacity=".06"/></pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22d3ee"/></marker>
  <marker id="arrowY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#facc15"/></marker>
</defs>

<rect width="1200" height="556" rx="20" fill="url(#bg)"/>
<rect width="1200" height="556" rx="20" fill="url(#grid)"/>
<rect x="8" y="8" width="1184" height="540" rx="14" fill="none" stroke="#2a3a52"/>
<rect class="edge" x="8" y="8" width="1184" height="540" rx="14" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="300 300" stroke-linecap="round"/>

<text x="75" y="62" font-size="15" fill="#22d3ee" font-weight="700" letter-spacing="3">FLAGSHIP PROJECT</text>
<text x="75" y="102" font-size="36" fill="#f1f5f9" font-weight="800">Unified Knowledge Agent</text>
<rect x="75" y="125" width="150" height="70" rx="10" fill="#101c30" stroke="#2a3a52" stroke-width="1"/>
<text x="150" y="155" font-size="19" fill="#f1f5f9" text-anchor="middle" font-weight="700">Question</text><text x="150" y="178" font-size="15" fill="#9fb0c6" text-anchor="middle">typed or voice</text>
<rect x="255" y="125" width="150" height="70" rx="10" fill="#101c30" stroke="#2a3a52" stroke-width="1"/>
<text x="330" y="155" font-size="19" fill="#f1f5f9" text-anchor="middle" font-weight="700">Input firewall</text><text x="330" y="178" font-size="15" fill="#9fb0c6" text-anchor="middle">blocks jailbreaks</text>
<rect x="435" y="125" width="150" height="70" rx="10" fill="#101c30" stroke="#2a3a52" stroke-width="1"/>
<text x="510" y="155" font-size="19" fill="#f1f5f9" text-anchor="middle" font-weight="700">Fast path</text><text x="510" y="178" font-size="15" fill="#9fb0c6" text-anchor="middle">direct lookup</text>
<rect x="615" y="125" width="150" height="70" rx="10" fill="#101c30" stroke="#2a3a52" stroke-width="1"/>
<text x="690" y="155" font-size="19" fill="#f1f5f9" text-anchor="middle" font-weight="700">Scope router</text><text x="690" y="178" font-size="15" fill="#9fb0c6" text-anchor="middle">in scope?</text>
<rect x="795" y="125" width="150" height="70" rx="10" fill="#101c30" stroke="#22d3ee" stroke-width="2"/>
<text x="870" y="155" font-size="19" fill="#f1f5f9" text-anchor="middle" font-weight="700">Agent</text><text x="870" y="178" font-size="15" fill="#9fb0c6" text-anchor="middle">LangGraph</text>
<rect x="975" y="125" width="150" height="70" rx="10" fill="#101c30" stroke="#2a3a52" stroke-width="1"/>
<text x="1050" y="155" font-size="19" fill="#f1f5f9" text-anchor="middle" font-weight="700">Answer</text><text x="1050" y="178" font-size="15" fill="#9fb0c6" text-anchor="middle">secrets masked</text>
<line class="flow" x1="226" y1="160" x2="253" y2="160" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/><line class="flow" x1="406" y1="160" x2="433" y2="160" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/><line class="flow" x1="586" y1="160" x2="613" y2="160" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/><line class="flow" x1="766" y1="160" x2="793" y2="160" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/><line class="flow" x1="946" y1="160" x2="973" y2="160" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="510" y1="196" x2="510" y2="232" stroke="#9fb0c6" stroke-dasharray="4 5"/>
<text x="510" y="255" font-size="15" fill="#9fb0c6" text-anchor="middle">Known lookups</text><text x="510" y="276" font-size="15" fill="#9fb0c6" text-anchor="middle">skip the LLM</text>
<line x1="690" y1="196" x2="690" y2="232" stroke="#9fb0c6" stroke-dasharray="4 5"/>
<text x="690" y="255" font-size="15" fill="#9fb0c6" text-anchor="middle">Out of scope:</text><text x="690" y="276" font-size="15" fill="#9fb0c6" text-anchor="middle">fixed reply</text>
<line class="flow" x1="925" y1="196" x2="925" y2="236" stroke="#facc15" stroke-width="2" marker-end="url(#arrowY)"/>
<rect class="pulse" x="880" y="238" width="245" height="60" rx="8" fill="#facc15" fill-opacity=".1" stroke="#facc15" stroke-width="2"/>
<text x="1002" y="263" font-size="17" fill="#facc15" text-anchor="middle" font-weight="800" letter-spacing="1">YELLOW CARD</text><text x="1002" y="286" font-size="15" fill="#f1f5f9" text-anchor="middle">A human approves heavy tools</text>
<line class="flow" x1="830" y1="196" x2="830" y2="316" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="435" y="318" width="690" height="72" rx="10" fill="#101c30" stroke="#2a3a52"/>
<text x="455" y="346" font-size="15" fill="#22d3ee" font-weight="700" letter-spacing="3">SEARCH TOOL</text>
<text x="455" y="375" font-size="16" fill="#f1f5f9" class="mono">expand query &gt; retrieve k=40 &gt; merge to 50 &gt; rerank &gt; top 10</text>
<text x="75" y="422" font-size="15" fill="#22d3ee" font-weight="700" letter-spacing="3">MEASURED ON THE PROJECT'S OWN TEST SET</text>
<rect x="75" y="436" width="240" height="92" rx="10" fill="#101c30" stroke="#2a3a52"/>
<text x="95" y="478" font-size="34" fill="#22d3ee" font-weight="800">94</text><text x="95" y="508" font-size="16" fill="#9fb0c6" >golden test cases</text><rect x="345" y="436" width="240" height="92" rx="10" fill="#101c30" stroke="#2a3a52"/>
<text x="365" y="478" font-size="34" fill="#22d3ee" font-weight="800">34/34</text><text x="365" y="508" font-size="16" fill="#9fb0c6" >search recall@k</text><rect x="615" y="436" width="240" height="92" rx="10" fill="#101c30" stroke="#2a3a52"/>
<text x="635" y="478" font-size="34" fill="#22d3ee" font-weight="800">90/94</text><text x="635" y="508" font-size="16" fill="#9fb0c6" >AI logic score</text><rect x="885" y="436" width="240" height="92" rx="10" fill="#101c30" stroke="#2a3a52"/>
<text x="905" y="478" font-size="34" fill="#facc15" font-weight="800">38/41</text><text x="905" y="508" font-size="16" fill="#9fb0c6" >AI logic, full RAG only</text>
</svg>
