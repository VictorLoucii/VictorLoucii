<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="t d">
<title id="t">AI Engineer</title><desc id="d">Header banner: AI Engineer and full-stack mobile and web developer.</desc>
<style>
  .flow{stroke-dasharray:5 11;animation:flow 2.2s linear infinite}
  .edge{animation:edge 30s linear infinite}
  .pulse{animation:pulse 4s ease-in-out infinite}
  @keyframes flow{to{stroke-dashoffset:-32}}
  @keyframes edge{to{stroke-dashoffset:-1200}}
  @keyframes pulse{50%{opacity:.45}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060b14"/><stop offset="1" stop-color="#0c1626"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22d3ee"/><stop offset=".7" stop-color="#22d3ee"/><stop offset="1" stop-color="#facc15"/></linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#38bdf8" stroke-opacity=".06"/></pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22d3ee"/></marker>
  <marker id="arrowY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#facc15"/></marker>
</defs>

<clipPath id="clip"><path d="M0 0H1200V205C980 275 780 165 560 215C360 260 170 250 0 200Z"/></clipPath>
<path d="M0 0H1200V205C980 275 780 165 560 215C360 260 170 250 0 200Z" fill="url(#bg)"/>
<rect width="1200" height="280" fill="url(#grid)" clip-path="url(#clip)"/>
<path d="M0 200C170 250 360 260 560 215C780 165 980 275 1200 205" fill="none" stroke="#2a3a52" stroke-width="2"/>
<path class="flow" d="M0 200C170 250 360 260 560 215C780 165 980 275 1200 205" fill="none" stroke="url(#accent)" stroke-width="3"/>
<text x="600" y="112" font-size="76" fill="#f1f5f9" text-anchor="middle" font-weight="800">AI Engineer</text>
<text x="600" y="160" font-size="26" fill="#22d3ee" text-anchor="middle" class="mono">&gt; Full-Stack Mobile &amp; Web Developer</text>
